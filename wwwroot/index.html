<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artifact Speculation Engine — Blazor</title>
    <meta name="description" content="Monte Carlo artifact simulator for Genshin Impact, powered by C++ WebAssembly." />
    <meta name="theme-color" content="#121620" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Artifact Speculation Engine" />
    <meta property="og:description" content="Simulate resin spending and see what artifacts you'd realistically get." />
    <meta name="twitter:card" content="summary" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="icons/speculation.png" />
    <link href="ArtifactSpeculationBlazor.styles.css" rel="stylesheet" />

    <!-- Load the Emscripten-generated JS glue (exposes global createArtifactEngine) -->
    <script src="wasm/artifact_engine.js"></script>
    <!-- Our thin bridge that Blazor calls via IJSRuntime -->
    <script src="js/wasmBridge.js"></script>

    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
