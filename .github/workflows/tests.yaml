name: Blazor Tests

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build app
        run: dotnet build ArtifactSpeculationBlazor.csproj --nologo

      - name: Build server
        run: dotnet build ArtifactSpeculationBlazor.Server/ArtifactSpeculationBlazor.Server.csproj --nologo

      - name: Run tests
        run: dotnet test ArtifactSpeculationBlazor.Tests/ArtifactSpeculationBlazor.Tests.csproj --nologo
